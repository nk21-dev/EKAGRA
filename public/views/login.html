<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — EKAGRA</title>
  <meta name="description" content="Sign in to EKAGRA — One Focus. Many Goals.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='5' r='3' fill='%23C084FC'/%3E%3Cpath d='M14.5 28C14.5 28 5 23 5 14C5 10 9.5 11.5 14.5 16Z' fill='%2306B6D4'/%3E%3Cpath d='M17.5 28C17.5 28 27 23 27 14C27 10 22.5 11.5 17.5 16Z' fill='%238B5CF6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <!-- Full-Screen Continuous Slow-Motion Video Background & Atmospheric Overlay -->
  <div class="auth-video-backdrop" aria-hidden="true">
    <video id="authBgVideo" class="auth-bg-video" src="/assets/auth-bg.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="auth-video-overlay"></div>
  </div>

  <!-- Header Navigation Bar -->
  <header class="auth-header-bar">
    <a href="/" class="back-to-home" title="Return to EKAGRA Home">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>EKAGRA</span>
    </a>
  </header>

  <!-- Centered Auth Viewport -->
  <main class="auth-viewport">
    <div class="auth-card">
      
      <!-- Brand Identity -->
      <div class="brand-identity">
        <div class="growth-emblem-wrap">
          <svg class="growth-emblem-svg" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="leftPetalGrad" x1="4" y1="32" x2="18" y2="12" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#06B6D4" />
                <stop offset="100%" stop-color="#14B8A6" />
              </linearGradient>
              <linearGradient id="rightPetalGrad" x1="20" y1="12" x2="34" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#8B5CF6" />
                <stop offset="100%" stop-color="#4F46E5" />
              </linearGradient>
              <linearGradient id="crownDotGrad" x1="16" y1="3" x2="22" y2="9" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#E9D5FF" />
                <stop offset="100%" stop-color="#A855F7" />
              </linearGradient>
            </defs>
            <circle cx="19" cy="20" r="14" fill="#10B981" opacity="0.15" />
            <circle cx="19" cy="6.5" r="3.2" fill="url(#crownDotGrad)" />
            <path d="M17.4 31.5C17.4 31.5 6 26.5 6 15.5C6 11 11.5 12.8 17.2 18.2C17.4 22.5 17.4 28.5 17.4 31.5Z" fill="url(#leftPetalGrad)" />
            <path d="M20.6 31.5C20.6 31.5 32 26.5 32 15.5C32 11 26.5 12.8 20.8 18.2C20.6 22.5 20.6 28.5 20.6 31.5Z" fill="url(#rightPetalGrad)" />
            <path d="M19 12V33" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
          </svg>
        </div>
        <h1 class="brand-title">EKAGRA</h1>
        <p class="brand-tagline">One Focus. Many Goals.</p>
      </div>

      <!-- Header -->
      <div class="card-header">
        <h2 class="card-title">Welcome back</h2>
        <p class="card-subtitle">Continue building your focus.</p>
      </div>

      <!-- Feedback Banner -->
      <div class="feedback-banner" id="loginFeedback" role="alert"></div>

      <!-- Sign In Form -->
      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="you@example.com" 
              autocomplete="email" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper has-toggle">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              required
            >
            <button type="button" class="pwd-toggle-btn" data-target="password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-actions-meta">
          <a href="/forgot-password" class="link-subtle">Forgot password?</a>
        </div>

        <button type="submit" class="btn-auth-primary" id="loginSubmitBtn">
          Sign In
        </button>
      </form>

      <!-- Switch Route -->
      <div class="auth-switch-text">
        Don't have an account?
        <a href="/signup">Create account</a>
      </div>

    </div>

    <footer class="auth-footer">
      <span>© 2026 EKAGRA. Sovereign personal execution engine.</span>
    </footer>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
